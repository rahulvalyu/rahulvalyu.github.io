<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Ready</title>
<style>body{font-family:system-ui,sans-serif;padding:24px;text-align:center}#c{font-size:20px;word-break:break-all;background:#f2f2f2;padding:16px;border-radius:8px;margin:16px 0}button{font-size:18px;padding:12px 24px}</style></head>
<body><h2>Tesla Ready</h2><p id="m">Copy this code and paste it back to Tesla Ready.</p><div id="c"></div><button id="b">Copy</button>
<script>var p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');var d=document.getElementById('c');if(c){d.textContent=c}else{document.getElementById('m').textContent='No code found.';d.textContent=e?('Error: '+e+' '+(p.get('error_description')||'')):'';document.getElementById('b').style.display='none'}
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(c).then(function(){document.getElementById('b').textContent='Copied'})};</script></body></html>
